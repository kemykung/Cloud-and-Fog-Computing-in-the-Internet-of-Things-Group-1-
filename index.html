<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pill Box Dashboard</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- date-fns adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    body { background: #f5f7fa; }
    .stat-card {
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-value { font-size: 2.5rem; font-weight: 700; }
    .stat-label { color: #6c757d; font-size: 0.9rem; }
    .chart-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">💊 Smart Pill Box Dashboard</span>
    <span class="text-white" id="last-update">Loading data...</span>
  </div>
</nav>

<div class="container">

  <!-- Stats Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="stat-card p-4 bg-white">
        <div class="stat-label">7-Day Completion Rate</div>
        <div class="stat-value text-success" id="stat-rate">--%</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card p-4 bg-white">
        <div class="stat-label">7-Day Doses Taken</div>
        <div class="stat-value text-primary"><span id="stat-taken">--</span>/21</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card p-4 bg-white">
        <div class="stat-label">Avg Response Time</div>
        <div class="stat-value text-info"><span id="stat-delay">--</span>s</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card p-4 bg-white">
        <div class="stat-label">Adherence Score</div>
        <div class="stat-value text-warning" id="stat-score">--</div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="chart-card">
        <h5>7-Day Completion Rate Trend</h5>
        <canvas id="chart-rate"></canvas>
      </div>
    </div>
    <div class="col-md-6">
      <div class="chart-card">
        <h5>Adherence Score Trend</h5>
        <canvas id="chart-score"></canvas>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="chart-card">
        <h5>Daily Doses Taken</h5>
        <canvas id="chart-daily"></canvas>
      </div>
    </div>
    <div class="col-md-6">
      <div class="chart-card">
        <h5>Response Delay per Dose</h5>
        <canvas id="chart-delay"></canvas>
      </div>
    </div>
  </div>

  <!-- Recent Records Table -->
  <div class="chart-card mb-4">
    <h5>Recent Records</h5>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Time</th>
            <th>Slot</th>
            <th>Status</th>
            <th>Delay</th>
          </tr>
        </thead>
        <tbody id="records-table"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// === ThingSpeak Settings ===
const CHANNEL_ID = "3390354";
const DAYS = 14;

const SLOT_NAMES = { 1: "Morning", 2: "Noon", 3: "Evening" };

// === Fetch Data ===
async function fetchData() {
  const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?days=${DAYS}`;
  try {
    const res = await fetch(url);
    const json = await res.json();
    return json.feeds;
  } catch (err) {
    console.error("Fetch failed:", err);
    return [];
  }
}

// === Process Data ===
function processData(feeds) {
  const events = [];
  const weeklyStats = [];

  feeds.forEach(f => {
    if (f.field1 !== null) {
      events.push({
        time: new Date(f.created_at),
        result: parseInt(f.field1),
        today_score: parseInt(f.field2),
        delay: parseInt(f.field3),
        slot: parseInt(f.field4),
      });
    }

    if (f.field5 !== null && f.field5 !== "") {
      weeklyStats.push({
        time: new Date(f.created_at),
        rate: parseFloat(f.field5),
        avgDelay: parseFloat(f.field6),
        taken: parseInt(f.field7),
        score: parseInt(f.field8),
      });
    }
  });

  return { events, weeklyStats };
}

// === Update Stats Cards ===
function updateStats(weeklyStats) {
  if (weeklyStats.length === 0) return;
  const latest = weeklyStats[weeklyStats.length - 1];

  document.getElementById("stat-rate").textContent = latest.rate + "%";
  document.getElementById("stat-taken").textContent = latest.taken;
  document.getElementById("stat-delay").textContent = latest.avgDelay.toFixed(1);
  document.getElementById("stat-score").textContent = latest.score;
}

// === Draw Line Chart ===
function drawTrendChart(canvasId, label, data, color) {
  return new Chart(document.getElementById(canvasId), {
    type: "line",
    data: {
      datasets: [{
        label: label,
        data: data.map(d => ({ x: d.time, y: d.value })),
        borderColor: color,
        backgroundColor: color + "33",
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { type: "time", time: { unit: "day" } },
        y: { beginAtZero: true }
      }
    }
  });
}

// === Draw Bar Chart ===
function drawBarChart(canvasId, label, data, color) {
  return new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: {
      datasets: [{
        label: label,
        data: data.map(d => ({ x: d.time, y: d.value })),
        backgroundColor: color,
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { type: "time", time: { unit: "day" } },
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });
}

// === Update Records Table ===
function updateTable(events) {
  const tbody = document.getElementById("records-table");
  const recent = events.slice(-15).reverse();

  tbody.innerHTML = recent.map(e => {
    const status = e.result === 1
      ? '<span class="badge bg-success">✓ Taken</span>'
      : '<span class="badge bg-danger">✗ Missed</span>';
    const delayStr = e.result === 1 ? e.delay + "s" : "Timeout";
    return `
      <tr>
        <td>${e.time.toLocaleString("en-US")}</td>
        <td>${SLOT_NAMES[e.slot] || "-"}</td>
        <td>${status}</td>
        <td>${delayStr}</td>
      </tr>
    `;
  }).join("");
}

// === Main ===
async function init() {
  const feeds = await fetchData();
  const { events, weeklyStats } = processData(feeds);

  document.getElementById("last-update").textContent =
    "Last updated: " + new Date().toLocaleString("en-US");

  updateStats(weeklyStats);

  drawTrendChart("chart-rate", "Completion Rate (%)",
    weeklyStats.map(s => ({ time: s.time, value: s.rate })),
    "#28a745"
  );

  drawTrendChart("chart-score", "Adherence Score",
    weeklyStats.map(s => ({ time: s.time, value: s.score })),
    "#ffc107"
  );

  const dailyDoses = {};
  events.forEach(e => {
    const dateKey = e.time.toISOString().split("T")[0];
    dailyDoses[dateKey] = e.today_score;
  });
  const dailyData = Object.entries(dailyDoses).map(([date, score]) => ({
    time: new Date(date),
    value: score
  }));
  drawBarChart("chart-daily", "Doses Taken", dailyData, "#0d6efd");

  const delayData = events
    .filter(e => e.result === 1)
    .map(e => ({ time: e.time, value: e.delay }));
  drawBarChart("chart-delay", "Delay (sec)", delayData, "#17a2b8");

  updateTable(events);
}

init();
setInterval(init, 60000);
</script>

</body>
</html>
